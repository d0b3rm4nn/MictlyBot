# Unico target operativo.
# La cuenta de Cinemex tiene raw card data habilitado, asi que acepta el
# numero crudo de la tarjeta. Es LIVE: valida tarjetas reales.
# OJO: 4242 (tarjeta de PRUEBA) es rechazada aqui por ser modo live.
default = "cinemex"

[targets.cinemex]
mode     = "stripe"
endpoint = "https://api.stripe.com/v1/payment_methods"
auth     = "key"
keys     = ["pk_live_51MP7sNLQy13nsb0kVTcpm8l2793ac466HHGgsxp3L5vW4FjbMuyfWr37coGtwiseedFA3hc5zVkrc2um6Tok1iuz00fixafMCK"]
origin   = "https://cinemex.com"
referer  = "https://cinemex.com/"
