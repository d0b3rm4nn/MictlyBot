# Perfil activo por defecto.
default = "donacion"

[targets.donacion]
mode     = "stripe"
endpoint = "https://api.stripe.com/v1/payment_methods"
auth     = "bearer"                          # sk -> bearer | basic   ·   pk -> key
keys     = ["[TU_SK_LIVE_AQUI]"]             # <-- REEMPLAZA (acepta varias, rota solo)
origin   = "https://[TU_DOMINIO.COM]"        # <-- REEMPLAZA
referer  = "https://[TU_DOMINIO.COM]/donar"  # <-- REEMPLAZA
# needles = ["Thank You For Donation."]       # opcional: marcador de exito propio

# Variante con la pk publica (la que usa el navegador de la pagina)
[targets.donacion-pk]
mode     = "stripe"
auth     = "key"
keys     = ["pk_live_XXXXXXXXXXXXXXXXXXXX"]
origin   = "https://[TU_DOMINIO.COM]"
referer  = "https://[TU_DOMINIO.COM]/donar"
