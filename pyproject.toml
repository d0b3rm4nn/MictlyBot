
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mictlybot"
version = "2.0.0"
description = "Bot de Telegram para consultar metadatos de BIN via BinList"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=20.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["mictlybot*"]

[tool.ruff.lint.per-file-ignores]
"mictlybot/useragents.py" = ["E501"]
"mictlybot/otp/*.py" = ["E501"]
